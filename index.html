<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0610">
<title>for you</title>
<meta property="og:title" content="for you">
<meta property="og:description" content="touch anywhere.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    height: 100svh;              /* iPhone: % of an unknown height is not a height */
    overflow: hidden;
    background: #0a0610; color: #f4eef7;
    font-family: 'Instrument Serif', Georgia, serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
  }
  #sky {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 100% 60% at 50% 8%,  #34143f 0%, transparent 62%),
      radial-gradient(ellipse 90% 55% at 50% 100%, #3a1026 0%, transparent 66%),
      radial-gradient(ellipse 60% 40% at 82% 72%,  #1d2a4a 0%, transparent 70%),
      #0a0610;
  }
  canvas { position: fixed; inset: 0; display: block; }
  #vig {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 84% 74% at 50% 50%, transparent 44%, rgba(6,3,10,.7) 100%);
  }

  .ui { position: fixed; pointer-events: none; z-index: 5; }
  #open {
    inset: 0; display: grid; place-items: center; text-align: center;
    padding: 0 28px;
    transition: opacity 1.1s cubic-bezier(.22,1,.32,1);
  }
  #open.gone { opacity: 0; }
  #open h1 {
    font-weight: 400; font-size: clamp(40px, 13vw, 74px);
    margin: 0; line-height: 1.02; letter-spacing: -.02em;
    text-shadow: 0 0 60px rgba(0,0,0,.9);
  }
  #open h1 em { font-style: italic; color: #f0a8c0; }
  #open p {
    margin: 20px 0 0; font-style: italic;
    font-size: clamp(15px, 4.2vw, 19px);
    color: rgba(244,238,247,.5);
    animation: breathe 3.6s ease-in-out 1.4s infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .42 } 50% { opacity: .9 } }

  #count {
    left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom));
    text-align: center; font-size: 14px; letter-spacing: .16em;
    color: rgba(244,238,247,.34);
    opacity: 0; transition: opacity .8s ease;
  }
  #count.on { opacity: 1; }
  #count b { font-weight: 400; color: rgba(244,238,247,.75); font-variant-numeric: tabular-nums; }


  #note {
    left: 0; right: 0; top: 40%;
    text-align: center; padding: 0 34px;
    font-style: italic; font-size: clamp(19px, 5.6vw, 28px);
    line-height: 1.42; color: rgba(244,238,247,.94);
    text-shadow: 0 0 46px rgba(6,3,10,.98), 0 0 96px rgba(6,3,10,.94);
    opacity: 0; transform: translateY(12px);
    transition: opacity 1.6s cubic-bezier(.22,1,.32,1), transform 1.6s cubic-bezier(.22,1,.32,1);
  }
  #note.on { opacity: 1; transform: none; }

  #clear {
    right: max(14px, env(safe-area-inset-right));
    bottom: max(52px, calc(env(safe-area-inset-bottom) + 44px));
    pointer-events: auto; border: none; background: none;
    font-family: inherit; font-style: italic; font-size: 14px;
    color: rgba(244,238,247,.3); padding: 10px 12px; cursor: pointer;
    opacity: 0; transition: opacity .8s ease, color .2s ease, transform .16s cubic-bezier(.22,1,.32,1);
  }
  #clear.on { opacity: 1; }
  #clear:active { transform: scale(.92); color: rgba(244,238,247,.7); }

  @media (prefers-reduced-motion: reduce) { #open p { animation: none; opacity: .7 } }
</style>
</head>
<body>

<div id="sky"></div>
<canvas id="c"></canvas>
<div id="vig"></div>

<div class="ui" id="open">
  <div>
    <h1>flowers for <em>Mihri&#351;ah</em></h1>
    <p>touch anywhere. keep touching.</p>
  </div>
</div>
<p class="ui" id="note"></p>
<p class="ui" id="count"><b>0</b> flowers</p>
<button class="ui" id="clear">start over</button>

<script>
(function () {
  'use strict';

  const NAMES = ['rose_blush','rose_crimson','rose_ox','rose_black',
                 'rose_violet','rose_white','rose_gold','rose_teal'];
  // rarity: the common ones show up constantly, the strange ones are a small event
  const WEIGHT = [22, 20, 14, 6, 10, 13, 9, 6];

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d', { alpha: true });
  const openEl = document.getElementById('open');
  const countEl = document.getElementById('count');
  const noteEl = document.getElementById('note');
  const clearEl = document.getElementById('clear');

  let W = 0, H = 0, DPR = 1;
  function size() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  size();
  addEventListener('resize', size);

  const FALLBACK = ['#ee9eb8','#c41e3a','#80102a','#3e1a32','#8c54d2','#f2eeee','#e8b05c','#44a2a0'];
  const imgs = [], okimg = [];
  NAMES.forEach((n, i) => {
    const im = new Image();
    im.onload  = () => { okimg[i] = true; };
    im.onerror = () => { okimg[i] = false; };
    im.src = 'f/' + n + '.png';
    imgs[i] = im;
  });
  // if the sprites never arrive, draw a rose instead of showing nothing
  function drawFallback(k, sz) {
    const c = FALLBACK[k];
    for (let ring = 3; ring >= 1; ring--) {
      const r = sz * 0.5 * (ring / 3);
      ctx.beginPath();
      for (let i = 0; i < 7; i++) {
        const a = i * 6.283 / 7 + ring * 0.4;
        ctx.ellipse(Math.cos(a) * r * .42, Math.sin(a) * r * .42, r * .46, r * .34, a, 0, 6.283);
      }
      ctx.fillStyle = c;
      ctx.globalAlpha *= ring === 3 ? 1 : .85;
      ctx.fill();
    }
  }

  const wTotal = WEIGHT.reduce((a, b) => a + b, 0);
  function pickKind() {
    let r = Math.random() * wTotal;
    for (let i = 0; i < WEIGHT.length; i++) { r -= WEIGHT[i]; if (r <= 0) return i; }
    return 0;
  }

  /* ---------- one flower ---------- */
  const MAX = 460;
  const flowers = [];
  let grown = 0;

  function bloom(x, y, burst) {
    const depth = Math.random();                    // 0 = far and small, 1 = near and big
    const size = (26 + depth * depth * 88) * (burst ? 1.15 : 1);
    const f = {
      x, y,
      vx: (Math.random() - .5) * (burst ? 2.2 : .7),
      vy: -(0.12 + Math.random() * 0.5) - depth * .25,
      kind: pickKind(),
      size,
      depth,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - .5) * 0.006,
      s: 0.001,                                     // never from zero: it swells into being
      target: 1,
      born: performance.now(),
      swayA: 0.25 + Math.random() * 0.7,
      swayF: 0.4 + Math.random() * 0.9,
      swayP: Math.random() * 6.28,
      alpha: 0,
      dying: false
    };
    flowers.push(f);
    grown++;
    if (flowers.length > MAX) flowers.splice(0, flowers.length - MAX);
    return f;
  }

  /* ---------- input ---------- */
  let started = false, lastSpawn = 0, lastPt = null;
  function begin() {
    if (started) return;
    started = true;
    openEl.classList.add('gone');
    countEl.classList.add('on');
    clearEl.classList.add('on');
    setTimeout(() => { openEl.style.display = 'none'; }, 1200);
  }

  function at(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  function spread(p, hard) {
    const now = performance.now();
    const gap = hard ? 0 : 46;
    if (now - lastSpawn < gap) return;
    lastSpawn = now;
    const n = hard ? 7 : 1;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, r = hard ? Math.random() * 70 : Math.random() * 16;
      bloom(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, hard);
    }
    // dragging fast throws more of them
    if (lastPt && !hard) {
      const d = Math.hypot(p.x - lastPt.x, p.y - lastPt.y);
      if (d > 26) bloom(p.x + (Math.random() - .5) * 30, p.y + (Math.random() - .5) * 30, false);
    }
    lastPt = p;
  }

  /* Input. Deliberately belt and braces: some mobile browsers (and every
     in-app browser) handle Pointer Events badly once touch-action is none,
     so touch and mouse are wired up independently and de-duplicated. */
  let down = false, usingTouch = false, lastTouchAt = 0;

  function press(p) {
    begin();
    down = true;
    lastPt = p;
    spread(p, true);
  }
  function drag(p) {
    if (!down) { press(p); return; }     // never get stuck: a move with no press still works
    spread(p, false);
  }
  function release() { down = false; lastPt = null; }

  // ---- touch ----
  function tStart(e) {
    usingTouch = true; lastTouchAt = Date.now();
    const t = e.touches && e.touches[0]; if (!t) return;
    press({ x: t.clientX, y: t.clientY });
  }
  function tMove(e) {
    usingTouch = true; lastTouchAt = Date.now();
    const t = e.touches && e.touches[0]; if (!t) return;
    if (e.cancelable) e.preventDefault();
    drag({ x: t.clientX, y: t.clientY });
  }
  document.addEventListener('touchstart', tStart, { passive: true });
  document.addEventListener('touchmove',  tMove,  { passive: false });
  document.addEventListener('touchend',   release, { passive: true });
  document.addEventListener('touchcancel', release, { passive: true });

  // ---- pointer / mouse, ignored while a real touch is driving ----
  const stale = () => Date.now() - lastTouchAt > 700;
  function pDown(e) { if (usingTouch && !stale()) return; press({ x: e.clientX, y: e.clientY }); }
  function pMove(e) {
    if (usingTouch && !stale()) return;
    if (!down) return;
    drag({ x: e.clientX, y: e.clientY });
  }
  if (window.PointerEvent) {
    document.addEventListener('pointerdown', pDown, { passive: true });
    document.addEventListener('pointermove', pMove, { passive: true });
    document.addEventListener('pointerup', release, { passive: true });
    document.addEventListener('pointercancel', release, { passive: true });
  } else {
    document.addEventListener('mousedown', pDown, { passive: true });
    document.addEventListener('mousemove', pMove, { passive: true });
    document.addEventListener('mouseup', release, { passive: true });
  }
  // last resort: if nothing above ever fired, a plain click still blooms
  document.addEventListener('click', e => {
    if (e.target === clearEl) return;
    if (Date.now() - lastSpawn < 400) return;
    press({ x: e.clientX, y: e.clientY });
    release();
  });
  addEventListener('blur', release);

  clearEl.addEventListener('click', e => {
    e.stopPropagation();
    flowers.forEach(f => { f.target = 0; f.dying = true; });
    grown = 0;
    shownNote = {};
    noteEl.classList.remove('on');
  });



  /* ============================================================
     The lines. Edit anything here, it is just text.
     The number is how many flowers she has grown when it appears.
     ============================================================ */
  const NOTES = {
    45:  'you have all night. keep going.',
    170: 'antalya. not alanya.\ni am never letting that go.',
    380: 'i had a bigger idea.\nbut you are bored now.',
    620: 'i am glad we talked properly.',
    900: 'text me when you land.'
  };
  let shownNote = {};
  let noteTimer = null;
  function checkNote() {
    for (const k in NOTES) {
      const n = +k;
      if (grown >= n && !shownNote[n]) {
        shownNote[n] = 1;
        noteEl.innerHTML = NOTES[n].replace(/\n/g, '<br>');
        noteEl.classList.add('on');
        clearTimeout(noteTimer);
        noteTimer = setTimeout(() => noteEl.classList.remove('on'), 6400);
      }
    }
  }

  /* ---------- loop ---------- */
  let last = performance.now(), acc = 0, idle = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 16.667, 3);
    last = now;

    // if she stops touching, the garden keeps breathing on its own
    if (started && !down && now - idle > 2600 && flowers.length < 130) {
      idle = now - 2200;
      bloom(40 + Math.random() * (W - 80), H * .25 + Math.random() * H * .6, false);
    }
    if (down) idle = now;

    ctx.clearRect(0, 0, W, H);

    for (let i = flowers.length - 1; i >= 0; i--) {
      const f = flowers[i];
      const age = (now - f.born) / 1000;

      // bloom: swells past its size then settles. nothing appears from nothing.
      f.s += (f.target - f.s) * (f.dying ? 0.09 : 0.14) * dt;
      if (!f.dying && age < .9) f.s = Math.min(f.s * (1 + .10 * Math.exp(-age * 4)), 1.10);
      f.alpha += ((f.dying ? 0 : 1) - f.alpha) * 0.10 * dt;
      if (f.dying && f.alpha < .01) { flowers.splice(i, 1); continue; }

      f.x += (f.vx + Math.sin(age * f.swayF + f.swayP) * f.swayA * (0.3 + f.depth)) * dt;
      f.y += f.vy * dt;
      f.vy *= (1 - 0.004 * dt);
      f.rot += f.spin * dt;

      if (f.y < -160) { flowers.splice(i, 1); continue; }

      const im = imgs[f.kind];
      const drawable = im && im.complete && im.naturalWidth > 0;
      if (!drawable && okimg[f.kind] !== false) continue;   // still loading, wait
      const sz = f.size * f.s;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.globalAlpha = f.alpha * (0.34 + f.depth * 0.66);
      if (f.depth < .34 && ctx.filter !== undefined) ctx.filter = 'blur(1.6px)';
      if (drawable) ctx.drawImage(im, -sz / 2, -sz / 2, sz, sz);
      else drawFallback(f.kind, sz);
      ctx.restore();
    }
    ctx.filter = 'none';
    ctx.globalAlpha = 1;

    if (started) {
      acc += dt;
      if (acc > 6) { acc = 0; countEl.firstElementChild.textContent = grown; checkNote(); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
